<svg width="680" height="720" viewBox="0 0 680 720" xmlns="http://www.w3.org/2000/svg" role="img">
<title>AutoResearch AI — System Architecture</title>
<desc>Architecture diagram showing user input flowing through FastAPI backend, multi-agent pipeline, four MCP servers, PostgreSQL, Redis, and Streamlit frontend.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
.box { fill: #f4f6fa; stroke: #c5ccd8; stroke-width: 0.5; }
.label { font-family: Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #1a2030; }
.sub { font-family: Arial, sans-serif; font-size: 11px; fill: #6b7280; }
.arr { stroke: #9ca3af; stroke-width: 1; fill: none; marker-end: url(#arrow); }
.dash { stroke: #c5ccd8; stroke-width: 0.5; stroke-dasharray: 5 4; fill: none; }
.purple { fill: #ede9fe; stroke: #7c3aed; }
.coral  { fill: #fce7e7; stroke: #dc2626; }
.amber  { fill: #fef3c7; stroke: #d97706; }
.green  { fill: #d1fae5; stroke: #059669; }
.teal   { fill: #ccfbf1; stroke: #0d9488; }
.blue   { fill: #dbeafe; stroke: #2563eb; }
.gray   { fill: #f3f4f6; stroke: #9ca3af; }
.purpletxt { fill: #4c1d95; }
.coraltxt  { fill: #991b1b; }
.ambertxt  { fill: #92400e; }
.greentxt  { fill: #064e3b; }
.tealtxt   { fill: #134e4a; }
.bluetxt   { fill: #1e3a5f; }
.graytxt   { fill: #374151; }
</style>
</defs>
 
<!-- Docker outer border -->
<rect x="20" y="8" width="640" height="700" rx="16" class="dash"/>
<text class="sub" x="38" y="24">Docker Compose</text>
 
<!-- User -->
<g>
  <rect x="280" y="28" width="120" height="40" rx="8" class="gray"/>
  <text class="label graytxt" x="340" y="51" text-anchor="middle">User</text>
</g>
 
<!-- Arrow: User → Frontend -->
<line x1="340" y1="68" x2="340" y2="94" class="arr"/>
 
<!-- Streamlit Frontend -->
<g>
  <rect x="210" y="94" width="260" height="48" rx="8" class="teal"/>
  <text class="label tealtxt" x="340" y="113" text-anchor="middle">Streamlit frontend</text>
  <text class="sub tealtxt" x="340" y="131" text-anchor="middle">port 8501</text>
</g>
 
<!-- Arrow: Frontend → Backend -->
<line x1="340" y1="142" x2="340" y2="168" class="arr"/>
 
<!-- FastAPI Backend -->
<g>
  <rect x="190" y="168" width="300" height="48" rx="8" class="blue"/>
  <text class="label bluetxt" x="340" y="187" text-anchor="middle">FastAPI backend</text>
  <text class="sub bluetxt" x="340" y="205" text-anchor="middle">WebSocket + REST · port 8000</text>
</g>
 
<!-- Arrow: Backend → Agents -->
<line x1="340" y1="216" x2="340" y2="244" class="arr"/>
 
<!-- Agent Pipeline dashed box -->
<rect x="55" y="244" width="570" height="160" rx="12" class="dash"/>
<text class="sub" x="72" y="260" font-style="italic">LangGraph agent pipeline</text>
 
<!-- Researcher -->
<g>
  <rect x="70" y="268" width="124" height="56" rx="8" class="purple"/>
  <text class="label purpletxt" x="132" y="291" text-anchor="middle">Researcher</text>
  <text class="sub purpletxt" x="132" y="309" text-anchor="middle">Search + collect</text>
</g>
 
<!-- Critic -->
<g>
  <rect x="212" y="268" width="124" height="56" rx="8" class="coral"/>
  <text class="label coraltxt" x="274" y="291" text-anchor="middle">Critic</text>
  <text class="sub coraltxt" x="274" y="309" text-anchor="middle">Fact-check + retry</text>
</g>
 
<!-- Writer -->
<g>
  <rect x="354" y="268" width="124" height="56" rx="8" class="amber"/>
  <text class="label ambertxt" x="416" y="291" text-anchor="middle">Writer</text>
  <text class="sub ambertxt" x="416" y="309" text-anchor="middle">Draft report</text>
</g>
 
<!-- Editor -->
<g>
  <rect x="496" y="268" width="118" height="56" rx="8" class="green"/>
  <text class="label greentxt" x="555" y="291" text-anchor="middle">Editor</text>
  <text class="sub greentxt" x="555" y="309" text-anchor="middle">Polish + finalise</text>
</g>
 
<!-- Agent arrows -->
<line x1="194" y1="296" x2="210" y2="296" class="arr"/>
<line x1="336" y1="296" x2="352" y2="296" class="arr"/>
<line x1="478" y1="296" x2="494" y2="296" class="arr"/>
 
<!-- Self-correction loop -->
<path d="M274 324 Q274 370 132 370 Q132 340 132 324" class="dash" marker-end="url(#arrow)"/>
<text class="sub" x="200" y="386" text-anchor="middle">self-correction loop</text>
 
<!-- Arrow: Pipeline → MCP -->
<line x1="340" y1="404" x2="340" y2="434" class="arr"/>
 
<!-- MCP label -->
<text class="sub" x="72" y="446" font-style="italic">MCP servers (HTTP)</text>
 
<!-- Web Search MCP -->
<g>
  <rect x="48" y="452" width="138" height="50" rx="8" class="blue"/>
  <text class="label bluetxt" x="117" y="472" text-anchor="middle">Web Search</text>
  <text class="sub bluetxt" x="117" y="490" text-anchor="middle">port 8001</text>
</g>
 
<!-- Finance MCP -->
<g>
  <rect x="200" y="452" width="138" height="50" rx="8" class="blue"/>
  <text class="label bluetxt" x="269" y="472" text-anchor="middle">Finance</text>
  <text class="sub bluetxt" x="269" y="490" text-anchor="middle">port 8002</text>
</g>
 
<!-- Doc Storage MCP -->
<g>
  <rect x="352" y="452" width="138" height="50" rx="8" class="blue"/>
  <text class="label bluetxt" x="421" y="472" text-anchor="middle">Doc Storage</text>
  <text class="sub bluetxt" x="421" y="490" text-anchor="middle">port 8003</text>
</g>
 
<!-- Sandbox MCP -->
<g>
  <rect x="504" y="452" width="138" height="50" rx="8" class="blue"/>
  <text class="label bluetxt" x="573" y="472" text-anchor="middle">Sandbox</text>
  <text class="sub bluetxt" x="573" y="490" text-anchor="middle">port 8004</text>
</g>
 
<!-- Lines from backend to data layer -->
<line x1="210" y1="200" x2="170" y2="560" class="arr"/>
<line x1="470" y1="200" x2="510" y2="560" class="arr"/>
 
<!-- PostgreSQL -->
<g>
  <rect x="80" y="560" width="200" height="52" rx="8" class="teal"/>
  <text class="label tealtxt" x="180" y="581" text-anchor="middle">PostgreSQL</text>
  <text class="sub tealtxt" x="180" y="599" text-anchor="middle">Reports DB · port 5432</text>
</g>
 
<!-- Redis -->
<g>
  <rect x="400" y="560" width="200" height="52" rx="8" class="amber"/>
  <text class="label ambertxt" x="500" y="581" text-anchor="middle">Redis</text>
  <text class="sub ambertxt" x="500" y="599" text-anchor="middle">LLM cache · port 6379</text>
</g>
 
<!-- LangSmith -->
<g>
  <rect x="230" y="636" width="220" height="46" rx="8" class="gray"/>
  <text class="label graytxt" x="340" y="657" text-anchor="middle">LangSmith</text>
  <text class="sub graytxt" x="340" y="673" text-anchor="middle">Agent tracing + observability</text>
</g>
 
</svg>
 